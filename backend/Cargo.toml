[package]
name = "evolith"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "evolith"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
api.workspace = true
common.workspace = true
infra.workspace = true
actix-web.workspace = true
actix-cors.workspace = true
actix-governor.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
sqlx.workspace = true
domain.workspace = true
service-auth.workspace = true
service-audit.workspace = true
service-skill.workspace = true
service-tool.workspace = true
uuid.workspace = true
rust-embed-for-web.workspace = true
actix-web-rust-embed-responder.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/service-tool",
    "crates/service-skill",
    "crates/service-snippet",
    "crates/service-auth",
    "crates/service-payment",
    "crates/domain",
    "crates/infra",
    "crates/common",
    "crates/service-audit",
    "crates/service-git",
]

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Evolith Team"]
license = "MIT"
repository = "https://github.com/wjhuang88/evolith"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"

# Embedded frontend
rust-embed-for-web = "11.3"
actix-web-rust-embed-responder = "2.4.0"

# Docker
bollard = "0.21.0"

# Git operations
gix = "0.78.0"

# Web framework
actix-web = "4.13.0"
actix-cors = "0.7.1"
actix-web-httpauth = "0.8.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "sqlite",
    "postgres",
    "mysql",
] }

# UUID
uuid = { version = "1.21.0", features = ["v4", "v5", "serde"] }
# Time
chrono = { version = "0.4.44", features = ["serde"] }

# Configuration
config = "0.15.23"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Regex for validation
regex = "1.12.3"
lazy_static = "1.5.0"
# JWT
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }

# Password hashing
argon2 = "0.5"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# JSON Schema validation
jsonschema = "0.46.5"

# Stripe payment
async-stripe = { version = "1.0.0-rc.6", features = ["rustls-tls-webpki-roots", "rustls-aws-lc-rs", "uuid"] }

# HTTP client for webhooks
reqwest = { version = "0.13.4", features = ["json", "stream", "form"] }

# HMAC for webhook signature verification
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4"

# Redis (async + connection pooling via deadpool)
redis = { version = "1.2.2", features = ["tokio-comp", "connection-manager"] }

# Rate limiting
actix-governor = "0.10.0"

# Email (async SMTP)
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

# Temp directories for testing
tempfile = "3"

# Prometheus metrics
actix-web-prom = "0.10.0"
prometheus = "0.14.0"

# Internal crates
api = { path = "crates/api" }
service-tool = { path = "crates/service-tool" }
service-skill = { path = "crates/service-skill" }
service-snippet = { path = "crates/service-snippet" }
service-auth = { path = "crates/service-auth" }
service-payment = { path = "crates/service-payment" }
domain = { path = "crates/domain" }
infra = { path = "crates/infra" }
common = { path = "crates/common" }
service-audit = { path = "crates/service-audit" }
service-git = { path = "crates/service-git" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
