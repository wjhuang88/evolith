[package]
name = "evolith"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "evolith"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
api.workspace = true
common.workspace = true
infra.workspace = true
actix-web.workspace = true
actix-cors.workspace = true
actix-governor.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
sqlx.workspace = true
domain.workspace = true
service-auth.workspace = true
service-audit.workspace = true
service-skill.workspace = true
service-tool.workspace = true
uuid.workspace = true

[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/service-tool",
    "crates/service-skill",
    "crates/service-snippet",
    "crates/service-auth",
    "crates/service-payment",
    "crates/domain",
    "crates/infra",
    "crates/common",
    "crates/service-audit",
]

[workspace.lints.clippy]
unwrap_used = "deny"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Evolith Team"]
license = "MIT"
repository = "https://github.com/wjhuang88/evolith"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures-util = "0.3"

# Docker
bollard = "0.17"

# Web framework
actix-web = "4.4"
actix-cors = "0.7"
actix-web-httpauth = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio",
    "tls-rustls",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "sqlite",
    "postgres",
    "mysql",
] }

# UUID
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
# Time
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Validation
validator = { version = "0.16", features = ["derive"] }

# Regex for validation
regex = "1.10"
lazy_static = "1.4"
# JWT
jsonwebtoken = "9.2"

# Password hashing
argon2 = "0.5"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# JSON Schema validation
jsonschema = "0.17"

# Stripe payment
async-stripe = { version = "0.41", features = ["runtime-tokio-hyper", "webhook-events"] }

# HTTP client for webhooks
reqwest = { version = "0.11", features = ["json", "stream"] }

# HMAC for webhook signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Redis (async + connection pooling via deadpool)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Rate limiting
actix-governor = "0.6"

# Email (async SMTP)
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

# Prometheus metrics
actix-web-prom = "0.8"
prometheus = "0.13"

# Internal crates
api = { path = "crates/api" }
service-tool = { path = "crates/service-tool" }
service-skill = { path = "crates/service-skill" }
service-snippet = { path = "crates/service-snippet" }
service-auth = { path = "crates/service-auth" }
service-payment = { path = "crates/service-payment" }
domain = { path = "crates/domain" }
infra = { path = "crates/infra" }
common = { path = "crates/common" }
service-audit = { path = "crates/service-audit" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
