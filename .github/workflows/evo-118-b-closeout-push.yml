name: evo-118-b-closeout-push

# Branch-scoped temporary runner; removed before PR review.
on:
  push:
    branches:
      - agent/close-evo-118-b

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: agent/close-evo-118-b

      - name: Reuse and apply reviewed closeout script
        run: |
          if grep -q -- '- **状态**：Done' docs/backlog/active/EVO-118-B-api-key-mcp-authorization-hardening.md; then
            echo "Closeout already applied"
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/evo-118-b-closeout.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          Path('/tmp/evo-118-b-closeout.py').write_text(script)
          PY

          python /tmp/evo-118-b-closeout.py
          git diff --check
          git status --short

          git config user.name "evolith-ci"
          git config user.email "actions@users.noreply.github.com"
          git add docs/backlog/active/EVO-118-B-api-key-mcp-authorization-hardening.md \
                  docs/iterations/ITERATION-051.md \
                  docs/iterations/README.md \
                  docs/backlog/active/EVO-118-production-readiness-and-security-hardening.md \
                  docs/BOARD.md \
                  docs/backlog/PRODUCT-BACKLOG.md \
                  docs/roadmap/PRODUCTION-READINESS-PLAN-2026-07.md \
                  docs/reference/PRODUCTION-READINESS-BASELINE.md
          git commit -m "docs: close EVO-118-B and iteration 051"
          git push origin HEAD:agent/close-evo-118-b
