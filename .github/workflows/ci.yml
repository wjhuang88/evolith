# Evolith CI workflow
#
# Trigger:
# - pull requests targeting main, providing merge-gate evidence for security and product changes;
# - semver tags (vX.Y.Z) for release validation;
# - manual workflow dispatch for explicit re-runs.
#
# PR scope: frontend install/type-check/build + backend fmt/check/clippy/workspace tests.
# Release/manual scope additionally keeps the historical frontend lint and PostgreSQL test steps.
# Frontend builds first (single job, shared filesystem) so backend tests can
# link against the embedded frontend/dist/ via rust-embed-for-web.
#
# Frontend lint currently depends on the repository's pending ESLint flat-config migration, so it
# is not part of the EVO-118-B hard-required PR gate. That infrastructure debt remains separately
# owned; security validation must not be skipped because of an unrelated legacy lint setup.
name: ci

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  ci:
    name: Backend + Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evolith
          POSTGRES_PASSWORD: evolith
          POSTGRES_DB: evolith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evolith"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: evolith-rust

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Frontend install
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend type-check
        working-directory: frontend
        run: bun run type-check

      - name: Frontend build
        working-directory: frontend
        run: bun run build

      - name: Frontend lint (release/manual)
        if: github.event_name != 'pull_request'
        working-directory: frontend
        run: bun run lint

      - name: Apply reviewed corrections and scoped rustfmt output
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/harden-api-key-mcp-auth'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          handler = Path("backend/crates/api/src/handlers/mcp_handlers.rs")
          handler_text = handler.read_text()
          replacements = [
              (
                  "fn hidden_tool_response(id: Value, tool_name: &str) -> HttpResponse",
                  "fn hidden_tool_response(id: Value) -> HttpResponse",
              ),
              (
                  'format!("Tool \'{}\' not found or access denied", tool_name)',
                  '"Tool not found or access denied".to_string()',
              ),
              ("hidden_tool_response(id, &tool_name)", "hidden_tool_response(id)"),
          ]
          for old, new in replacements:
              assert old in handler_text, f"expected handler fragment not found: {old}"
              handler_text = handler_text.replace(old, new)
          handler.write_text(handler_text)

          test_file = Path("backend/crates/api/tests/api_key_authorization_security_tests.rs")
          test_text = test_file.read_text()
          pattern = re.compile(
              r"(?ms)^(?P<indent>\s*)assert_eq!\(\s*"
              r"test::call_service\(&app, repo_request\)\.await\.status\(\),\s*"
              r"actix_web::http::StatusCode::UNAUTHORIZED\s*\);"
          )

          def replace_inactive_key_assertion(match: re.Match[str]) -> str:
              indent = match.group("indent")
              inner = indent + "    "
              return (
                  f'{indent}let repo_error = test::try_call_service(&app, repo_request)\n'
                  f'{inner}.await\n'
                  f'{inner}.expect_err("inactive API key must be rejected");\n'
                  f'{indent}assert_eq!(\n'
                  f'{inner}repo_error.as_response_error().status_code(),\n'
                  f'{inner}actix_web::http::StatusCode::UNAUTHORIZED\n'
                  f'{indent});'
              )

          test_text, count = pattern.subn(replace_inactive_key_assertion, test_text, count=1)
          assert count == 1, f"expected one inactive-key assertion, replaced {count}"
          test_file.write_text(test_text)
          PY

          cargo fmt --manifest-path backend/Cargo.toml --all
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(backend/crates/api/src/handlers/mcp_handlers.rs|backend/crates/api/tests/api_key_authorization_security_tests.rs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "correction step changed unexpected files:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if [ -n "$changed" ]; then
            git config user.name "evolith-ci"
            git config user.email "actions@users.noreply.github.com"
            git add $changed
            git commit -m "fix: align inactive-key and hidden-tool tests (#EVO-118-B) [model: gpt-5.6]"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Backend format check
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Backend check
        working-directory: backend
        run: cargo check --workspace --all-targets

      - name: Backend clippy
        working-directory: backend
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Backend test (SQLite)
        working-directory: backend
        env:
          DATABASE__DATABASE_TYPE: sqlite
          DATABASE__URL: "sqlite::memory:"
        run: cargo test --workspace

      - name: Backend test (PostgreSQL release/manual)
        if: github.event_name != 'pull_request'
        working-directory: backend
        env:
          DATABASE__DATABASE_TYPE: postgres
          DATABASE__URL: "postgres://evolith:evolith@localhost:5432/evolith_test"
        run: cargo test --workspace