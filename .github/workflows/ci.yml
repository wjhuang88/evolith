# Evolith CI workflow
#
# Trigger:
# - pull requests targeting main, providing exact-head merge-gate evidence;
# - semver tags (vX.Y.Z) for release validation;
# - manual workflow dispatch for explicit re-runs.
#
# PR scope: frontend install/type-check/build + backend fmt/check/clippy/workspace tests
# + DATA-01 joint PostgreSQL/Git backup-restore, application recovery and container-volume matrices.
# Release/manual scope additionally keeps the historical frontend lint, PostgreSQL tests and
# production Compose clean-build/startup diagnostics owned by DEPLOY-01.
# Frontend builds first (single job, shared filesystem) so backend tests can
# link against the embedded frontend/dist/ via rust-embed-for-web.
#
# Frontend lint currently depends on the repository's pending ESLint flat-config migration, so it
# is not part of the hard-required PR gate. Release/manual runs retain it.
name: ci

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  ci:
    name: Backend + Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 55

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evolith
          POSTGRES_PASSWORD: evolith
          POSTGRES_DB: evolith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evolith"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Diff whitespace check
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"

      - name: Markdown local link check
        if: github.event_name == 'pull_request'
        env:
          MARKDOWN_LINK_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/tests/check-markdown-links.py

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: evolith-rust

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Frontend install
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Frontend type-check
        working-directory: frontend
        run: bun run type-check

      - name: Frontend build
        working-directory: frontend
        run: bun run build

      - name: Frontend lint (release/manual)
        if: github.event_name != 'pull_request'
        working-directory: frontend
        run: bun run lint

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Durability script syntax
        run: |
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh
          bash -n scripts/git-storage-inventory.sh
          bash -n scripts/tests/durability.sh
          bash -n scripts/tests/container-volume-persistence.sh
          bash -n scripts/tests/application-recovery-drill.sh

      - name: Production Compose durability mapping
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          JWT_SECRET: ci-jwt-secret-at-least-thirty-two-characters
        run: |
          docker compose -f docker-compose.prod.yml config >/tmp/evolith-compose.yml
          grep -F 'GIT_STORAGE__BASE_PATH: /var/lib/evolith/git' /tmp/evolith-compose.yml
          grep -F 'source: git_data' /tmp/evolith-compose.yml
          grep -F 'target: /var/lib/evolith/git' /tmp/evolith-compose.yml

      - name: Durability backup and restore integration
        env:
          POSTGRES_BASE_URL: postgres://evolith:evolith@localhost:5432
          POSTGRES_ADMIN_URL: postgres://evolith:evolith@localhost:5432/postgres
        run: bash scripts/tests/durability.sh

      - name: Git volume container recreation
        run: bash scripts/tests/container-volume-persistence.sh

      - name: Backend format check
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Backend check
        working-directory: backend
        run: cargo check --workspace --all-targets

      - name: Backend clippy
        working-directory: backend
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Backend test (SQLite)
        working-directory: backend
        env:
          DATABASE__DATABASE_TYPE: sqlite
          DATABASE__URL: "sqlite::memory:"
        run: cargo test --workspace

      - name: Build application recovery binary
        working-directory: backend
        run: cargo build --bin evolith

      - name: Application-level recovery drill
        env:
          POSTGRES_BASE_URL: postgres://evolith:evolith@localhost:5432
          POSTGRES_ADMIN_URL: postgres://evolith:evolith@localhost:5432/postgres
          EVOLITH_BINARY: backend/target/debug/evolith
          EVOLITH_APP_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/tests/application-recovery-drill.sh

      - name: Backend test (PostgreSQL release/manual)
        if: github.event_name != 'pull_request'
        working-directory: backend
        env:
          DATABASE__DATABASE_TYPE: postgres
          DATABASE__URL: "postgres://evolith:evolith@localhost:5432/evolith_test"
        run: cargo test --workspace

      - name: Production Compose clean build diagnostic (release/manual)
        id: production_build
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          JWT_SECRET: ci-jwt-secret-at-least-thirty-two-characters
        run: docker compose -f docker-compose.prod.yml build --no-cache

      - name: Production Compose startup diagnostic (release/manual)
        id: production_up
        if: github.event_name != 'pull_request' && steps.production_build.outcome == 'success'
        continue-on-error: true
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          JWT_SECRET: ci-jwt-secret-at-least-thirty-two-characters
        run: |
          docker compose -f docker-compose.prod.yml up -d
          for attempt in $(seq 1 60); do
            if docker compose -f docker-compose.prod.yml exec -T backend \
                curl -sf http://localhost:8080/health/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml ps
          exit 1

      - name: Record production Compose diagnostic (release/manual)
        if: always() && github.event_name != 'pull_request'
        env:
          BUILD_OUTCOME: ${{ steps.production_build.outcome }}
          STARTUP_OUTCOME: ${{ steps.production_up.outcome }}
        run: |
          printf 'Production Compose clean build outcome: %s\n' "$BUILD_OUTCOME"
          printf 'Production Compose startup outcome: %s\n' "$STARTUP_OUTCOME"
          if [[ "$BUILD_OUTCOME" != "success" ]]; then
            printf 'Known DEPLOY-01 remains open; this diagnostic is not a DATA-01 success substitute.\n'
          fi

      - name: Stop production Compose diagnostic (release/manual)
        if: always() && github.event_name != 'pull_request'
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          JWT_SECRET: ci-jwt-secret-at-least-thirty-two-characters
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans || true
