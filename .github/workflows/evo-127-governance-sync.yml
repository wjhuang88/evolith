name: evo-127-governance-sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  governance-sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/evo-127-graphql-architecture-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify exact event head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Fix derived navigation only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          board = Path('docs/BOARD.md')
          text = board.read_text()
          old = '''| 3 | EVO-126-C Smart HTTP read | Proposed | B |
| 4 | EVO-126-E Repo Context parity | Proposed | B |
| 5 | EVO-126-D WAL receive-pack | Proposed | B |
| 6 | EVO-126-F object-store operations/migration | Proposed | B + final parity C/D/E |
| 7 | EVO-126-G bundle-uri | Proposed | C/F |
| 8 | EVO-126-H cutover/legacy Git engine removal | Proposed | C/D/E/F/G |'''
          new = '''| 4 | EVO-127-D Repository CRUD GraphQL | Proposed | EVO-127-A + EVO-126-B |
| 5 | EVO-126-C Smart HTTP read | Proposed | EVO-126-B |
| 6 | EVO-126-E Repo Context parity | Proposed | EVO-126-B |
| 7 | EVO-126-D WAL receive-pack | Proposed | EVO-126-B |
| 8 | EVO-127-E Repo Context GraphQL | Proposed | EVO-127-A + EVO-126-E |
| 9 | EVO-127-G REST business API retirement | Proposed | EVO-127-B/C/D/E/F |
| 10 | EVO-126-F object-store operations/migration | Proposed | B + final parity C/D/E |
| 11 | EVO-126-G bundle-uri | Proposed | C/F |
| 12 | EVO-126-H cutover/legacy Git engine removal | Proposed | C/D/E/F/G |'''
          if old not in text:
              raise SystemExit('Board sequence anchor missing')
          board.write_text(text.replace(old, new, 1))

          docs = Path('docs/README.md')
          text = docs.read_text()
          text = text.replace('6. [EVO-126 Epic](backlog/active/EVO-126-walgit-git-data-plane-refactor.md) — P0 架构重构；A 正在 Review/收口，B 是 A 关闭后的下一依赖切片，C~H 继续按依赖 Proposed；GitHub tracking #12~#20。', '6. [EVO-126 Epic](backlog/active/EVO-126-walgit-git-data-plane-refactor.md) — P0 Git data-plane 重构；A Done，B Ready，C~H 按依赖推进；GitHub tracking #12~#20。')
          old_chain = '''EVO-126-A（当前收口）
→ EVO-126-B
→ EVO-126-C / E / D（按依赖小批次）
→ EVO-126-F
→ EVO-126-G
→ EVO-126-H / GIT-DP-01 Close
→ EVO-105 / 106 / 107 / 104
→ Experience / Discovery / legacy cleanup
→ EVO-118-E final production convergence'''
          new_chain = '''EVO-127-A GraphQL foundation
→ EVO-127-B / C / F non-Git application slices
→ EVO-126-B service-git v2 boundary
→ EVO-127-D Repository CRUD GraphQL
→ EVO-126-C / E / D Git protocol/context engine slices
→ EVO-127-E Repo Context GraphQL
→ EVO-127-G / API-GQL-01 Close
→ EVO-126-F / G / H / GIT-DP-01 Close
→ EVO-105 / 106 / 107 / 104
→ Experience / Discovery / legacy cleanup
→ EVO-118-E final production convergence'''
          if old_chain not in text:
              raise SystemExit('Docs map execution-chain anchor missing')
          text = text.replace(old_chain, new_chain, 1)
          text = text.replace('- [API 合约](reference/API-CONTRACT.md) — HTTP API、认证与错误响应。', '- [API 合约](reference/API-CONTRACT.md) — 当前 REST runtime 合约；EVO-127 迁移期间逐步由 GraphQL schema/ADR-0012 替代 application/business API 部分，protocol endpoints 继续保留。')
          docs.write_text(text)
          PY

      - name: Commit only derived docs
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'docs/BOARD.md\ndocs/README.md'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/BOARD.md docs/README.md
          git commit -m 'docs(governance): align GraphQL execution navigation (#26) [model: GPT-5.6 Sol]'
          git push origin "HEAD:${HEAD_REF}"
