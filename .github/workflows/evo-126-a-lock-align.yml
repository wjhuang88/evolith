name: evo-126-a-lock-align

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: evo-126-a-lock-align-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  align-lock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/evo-126-a-walgit-dependency-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify exact event head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Install WalGit build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Align AWS SDK family to WalGit pinned lock baseline
        working-directory: backend
        shell: bash
        run: |
          set -euxo pipefail
          # Move public roots first, then dependency layers from parents to leaves.
          cargo update -p aws-config --precise 1.10.1
          cargo update -p aws-sdk-s3 --precise 1.141.0
          cargo update -p aws-sdk-sso --precise 1.105.0
          cargo update -p aws-sdk-ssooidc --precise 1.107.0
          cargo update -p aws-sdk-sts --precise 1.110.0
          cargo update -p aws-runtime --precise 1.9.1
          cargo update -p aws-smithy-runtime --precise 1.12.1
          cargo update -p aws-types --precise 1.5.0
          cargo update -p aws-credential-types --precise 1.3.0
          cargo update -p aws-sigv4 --precise 1.5.1
          cargo update -p aws-smithy-checksums --precise 0.65.0
          cargo update -p aws-smithy-http --precise 0.64.0
          cargo update -p aws-smithy-eventstream --precise 0.61.1
          cargo update -p aws-smithy-http-client --precise 1.2.0
          cargo update -p aws-smithy-json --precise 0.63.0
          cargo update -p aws-smithy-query --precise 0.62.0
          cargo update -p aws-smithy-xml --precise 0.62.0
          cargo update -p aws-smithy-schema@0.2.1 --precise 0.2.0
          cargo update -p aws-smithy-runtime-api --precise 1.14.0
          cargo update -p aws-smithy-async --precise 1.3.0
          cargo update -p aws-smithy-observability --precise 0.3.0
          cargo update -p aws-smithy-runtime-api-macros --precise 1.1.0
          cargo update -p aws-smithy-types --precise 1.6.1

      - name: Assert coherent AWS lock family
        working-directory: backend
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import tomllib

          lock = tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          packages = {}
          for package in lock['package']:
              packages.setdefault(package['name'], []).append(package['version'])

          expected = {
              'aws-config': ['1.10.1'],
              'aws-credential-types': ['1.3.0'],
              'aws-runtime': ['1.9.1'],
              'aws-sdk-s3': ['1.141.0'],
              'aws-sdk-sso': ['1.105.0'],
              'aws-sdk-ssooidc': ['1.107.0'],
              'aws-sdk-sts': ['1.110.0'],
              'aws-sigv4': ['1.5.1'],
              'aws-smithy-async': ['1.3.0'],
              'aws-smithy-checksums': ['0.65.0'],
              'aws-smithy-eventstream': ['0.61.1'],
              'aws-smithy-http': ['0.64.0'],
              'aws-smithy-http-client': ['1.2.0'],
              'aws-smithy-json': ['0.63.0'],
              'aws-smithy-observability': ['0.3.0'],
              'aws-smithy-query': ['0.62.0'],
              'aws-smithy-runtime': ['1.12.1'],
              'aws-smithy-runtime-api': ['1.14.0'],
              'aws-smithy-runtime-api-macros': ['1.1.0'],
              'aws-smithy-schema': ['0.2.0'],
              'aws-smithy-types': ['1.6.1'],
              'aws-smithy-xml': ['0.62.0'],
              'aws-types': ['1.5.0'],
          }
          for name, versions in expected.items():
              actual = packages.get(name, [])
              if actual != versions:
                  raise SystemExit(f'{name}: expected {versions}, got {actual}')
          PY

      - name: Commit only the resolved lockfile
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euxo pipefail
          status="$(git status --porcelain)"
          printf '%s\n' "$status"
          test -n "$status"
          test "$(printf '%s\n' "$status" | wc -l)" -eq 1
          printf '%s\n' "$status" | grep -Eq '^ M backend/Cargo\.lock$'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/Cargo.lock
          git diff --cached --name-only | grep -Fx 'backend/Cargo.lock'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'chore(walgit): align AWS lock family (#13) [model: GPT-5.6 Sol]'
          git push origin "HEAD:${HEAD_REF}"
