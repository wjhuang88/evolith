name: evo-118-b-closeout

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  closeout:
    if: github.head_ref == 'agent/close-evo-118-b'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply governance closeout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          MERGE_SHA = "6de7845e1231efc04f94f16cb9ab0a410f6ad2d9"
          HEAD_SHA = "192627a32d7a6f9a780624227db2f357b7350b36"
          CI_RUN = "30567361095"
          MERGED_AT = "2026-07-31 12:30:50 +08:00"

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, text: str) -> None:
              Path(path).write_text(text)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise AssertionError(f"missing closeout marker: {label}")
              return text.replace(old, new, 1)

          # Story owner document.
          path = "docs/backlog/active/EVO-118-B-api-key-mcp-authorization-hardening.md"
          text = read(path)
          text = replace_once(text, "- **状态**：Review", "- **状态**：Done", "story status")
          text = replace_once(
              text,
              "- 最新 head 的最终只读 `cargo test --workspace` 正在复验 RBAC 状态修复；通过前不标记 Done。",
              f"- 最终只读 GitHub Actions run `{CI_RUN}` 在 head `{HEAD_SHA}` 上全部通过，包括 `cargo test --workspace`。",
              "story final test evidence",
          )
          text = replace_once(
              text,
              "| 验证证据 | GitHub Actions 前端/type-check/build、Rust fmt/check/clippy；workspace tests 最终只读复验中 |",
              f"| 验证证据 | GitHub Actions run `{CI_RUN}`：前端 install/type-check/build 与 Rust fmt/check/clippy/workspace tests 全部通过 |",
              "story evidence table",
          )
          text = replace_once(
              text,
              "| 残余工作归口 | 最新 head CI 全绿、reviewer 复审与 PR merge；SSRF 归 EVO-118-C；Agent scoped token 归 EVO-105/106；legacy Key 轮换记录在 Reference |",
              "| 残余工作归口 | SEC-01 已解除；SSRF 归 EVO-118-C；Agent scoped token 归 EVO-105/106；legacy Key 轮换记录在 Reference |",
              "story residual table",
          )
          text = replace_once(
              text,
              "PR #3 的最终只读 CI 全部通过、reviewer 确认并合并后，解除 SEC-01 Gate；下一项按计划启动 EVO-118-C。",
              f"PR #3 已于 {MERGED_AT} 合并，merge commit `{MERGE_SHA}`；最终 CI run `{CI_RUN}` 全绿，SEC-01 Gate 已解除。下一项按计划进入 EVO-118-C。",
              "story unlock",
          )
          text += f"\n\n## 完成记录\n\n- PR：#3 `security: harden API key and MCP authorization`\n- 合并时间：{MERGED_AT}\n- Merge commit：`{MERGE_SHA}`\n- 验证 head：`{HEAD_SHA}`\n- 最终只读 CI：`{CI_RUN}`，全部 required gates 通过\n- 闭环结论：`Complete`；SEC-01 已解除\n"
          write(path, text)

          # Iteration owner document.
          path = "docs/iterations/ITERATION-051.md"
          text = read(path)
          text = replace_once(text, "> 文档状态：Review", "> 文档状态：Closed / Complete", "iteration status")
          text = replace_once(
              text,
              "| 验证证据 | GitHub Actions 前端 type-check/build、Rust fmt/check/clippy；workspace test 最终只读复验中 |",
              f"| 验证证据 | GitHub Actions run `{CI_RUN}`：前端 install/type-check/build 与 Rust fmt/check/clippy/workspace tests 全部通过 |",
              "iteration evidence table",
          )
          text = replace_once(
              text,
              "| 残余工作归口 | 最新 head CI 全绿、reviewer 复审与 merge；SSRF → EVO-118-C；Agent token → EVO-105/106；legacy Key 轮换 → Permissions Reference |",
              "| 残余工作归口 | SEC-01 已解除；SSRF → EVO-118-C；Agent token → EVO-105/106；legacy Key 轮换 → Permissions Reference |",
              "iteration residual table",
          )
          text = replace_once(
              text,
              "| 2026-07-31 | validation | 最新 head 的只读 workspace tests 正在复验 RBAC 映射；通过前保持 Partial |",
              f"| 2026-07-31 | validation | 最终只读 CI run `{CI_RUN}` 全绿，包含完整 `cargo test --workspace` |\n| 2026-07-31 | merge | PR #3 已合并，merge commit `{MERGE_SHA}`；EVO-118-B Done，Iteration 051 Closed / Complete |",
              "iteration validation record",
          )
          text = replace_once(
              text,
              "- 已通过：frontend install/type-check/build；backend fmt/check/clippy；多数 workspace tests 和全部新增边界除最终 RBAC 复验。",
              "- 已通过：frontend install/type-check/build；backend fmt/check/clippy；完整 workspace tests；reviewer 边界复验。",
              "iteration review passed",
          )
          text = replace_once(
              text,
              "- 未完成：最新 head 的只读 `cargo test --workspace` 最终结果、reviewer 复审和 PR merge。",
              "- 未完成：无；后续工作已归口到 EVO-118-C 及既有 Agent/legacy Key Story。",
              "iteration review remaining",
          )
          text = replace_once(text, "- 闭环状态：`Partial`", "- 闭环状态：`Complete`", "iteration closure")
          text = replace_once(
              text,
              "- 残余归口：最终 CI 全绿后将 PR 转 Ready for Review；merge 后关闭 EVO-118-B/Iteration 051，随后启动 EVO-118-C。",
              "- 残余归口：下一 Story 为 EVO-118-C；本 Iteration 不包含其实现。",
              "iteration residual review",
          )
          write(path, text)

          # Iteration inventory/index.
          path = "docs/iterations/README.md"
          text = read(path)
          text = re.sub(
              r"^\| \[Iteration 051\]\(ITERATION-051\.md\) \| Review / Partial \|.*\n",
              "",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          text = replace_once(
              text,
              "- Iteration 051 是唯一非终态 Story；WIP 只处理 PR #3 验证和审查，不并行启动 EVO-118-C。\n- 051 全部门禁通过、PR 合并并关闭后，默认进入 EVO-118-C，不直接激活 Repo UI。",
              "- Iteration 051 已 Closed / Complete；PR #3 已合并并解除 SEC-01。\n- 当前没有未处置的 Active/In Progress/Review Iteration；下一次激活默认选择 EVO-118-C，不直接激活 Repo UI。",
              "iteration inventory conclusion",
          )
          text = replace_once(
              text,
              "| [Iteration 050](ITERATION-050.md) | Closed | 项目体检治理基线与生产就绪重排；EVO-118-A Done |",
              "| [Iteration 050](ITERATION-050.md) | Closed | 项目体检治理基线与生产就绪重排；EVO-118-A Done |\n| [Iteration 051](ITERATION-051.md) | Closed | API Key/MCP 授权边界硬化；EVO-118-B Done，SEC-01 解除 |",
              "iteration completed index",
          )
          write(path, text)

          # Epic.
          path = "docs/backlog/active/EVO-118-production-readiness-and-security-hardening.md"
          text = read(path)
          text = replace_once(
              text,
              "| [EVO-118-B](EVO-118-B-api-key-mcp-authorization-hardening.md) | API Key/RBAC/MCP execute 权限边界闭合 | Review | P0 | EVO-118-A Done | Iteration 051 / PR #3 |",
              "| [EVO-118-B](EVO-118-B-api-key-mcp-authorization-hardening.md) | API Key/RBAC/MCP execute 权限边界闭合 | Done | P0 | EVO-118-A Done | Iteration 051 / PR #3 merged |",
              "epic child row",
          )
          text = replace_once(
              text,
              "当前进度：EVO-118-B 已形成 Draft PR #3，但 hard-required Rust/前端门禁未运行，SEC-01 尚未解除。",
              f"当前进度：EVO-118-A/B 已 Done。PR #3 已合并（`{MERGE_SHA}`），最终 CI run `{CI_RUN}` 全绿，SEC-01 已解除；下一项为 EVO-118-C。",
              "epic current progress",
          )
          write(path, text)

          # Operating Board: remove completed Story from Now/Review and advance C as next activation.
          path = "docs/BOARD.md"
          text = read(path)
          replacement = """## Now

| Item | State | Owner Doc | Gate |
|------|-------|-----------|------|
| EVO-118 Production Readiness Epic | In Progress | [Epic](backlog/active/EVO-118-production-readiness-and-security-hardening.md) | A/B Done；S1 继续按 WIP 推进 C → D → E。 |

## Review

当前没有未处置的产品/安全 Story Review。EVO-118-B 与 Iteration 051 已完成并关闭。

"""
          text, count = re.subn(
              r"## Now\n.*?(?=## Blocked Or Paused)",
              replacement,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise AssertionError("failed to replace Board Now/Review")
          text = replace_once(
              text,
              "- EVO-118-B 实现已进入 Draft PR #3，但缺 hard-required 运行验证，SEC-01 尚未解除。",
              f"- EVO-118-B/Iteration 051 已由 PR #3 合并并关闭；merge commit `{MERGE_SHA}`，最终 CI run `{CI_RUN}` 全绿，SEC-01 已解除。",
              "board operating review B",
          )
          text = replace_once(
              text,
              "- 当前启动顺序：完成 PR #3 验证/合并 → EVO-118-C → D → E → F/G/H → EVO-112 → EVO-105/106/107/104 → EVO-108/109/110 → EVO-111。",
              "- 当前启动顺序：EVO-118-C → D → E → F/G/H → EVO-112 → EVO-105/106/107/104 → EVO-108/109/110 → EVO-111。",
              "board sequence",
          )
          write(path, text)

          # Product Backlog: remove completed B from current priorities and close its active row.
          path = "docs/backlog/PRODUCT-BACKLOG.md"
          text = read(path)
          text, count = re.subn(
              r"^\| EVO-118-B \| API Key 与 MCP 授权边界硬化 \| Review \| P0 \| Iteration 051 / Draft PR #3；.*\n",
              "",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise AssertionError("failed to remove B current-priority row")
          text = replace_once(
              text,
              "| EVO-118 | Epic: Production Readiness and Security Hardening | In Progress | P0 | Phase E'-1 与 Repo UI/Agent 集成之间的稳定化门禁；A Done，B Review，C~E Ready，F~H Proposed |",
              "| EVO-118 | Epic: Production Readiness and Security Hardening | In Progress | P0 | Phase E'-1 与 Repo UI/Agent 集成之间的稳定化门禁；A/B Done，C~E Ready，F~H Proposed |",
              "backlog epic context",
          )
          text = replace_once(
              text,
              "| EVO-118-B | API Key 与 MCP 授权边界硬化 | Review | P0 | Iteration 051 / Draft PR #3；运行门禁待补，解除 SEC-01 尚未完成 |",
              f"| EVO-118-B | API Key 与 MCP 授权边界硬化 | Done | P0 | Iteration 051 Closed；PR #3 merged `{MERGE_SHA}`；CI `{CI_RUN}` 全绿，SEC-01 已解除 |",
              "backlog active B row",
          )
          write(path, text)

          # Current execution plan.
          path = "docs/roadmap/PRODUCTION-READINESS-PLAN-2026-07.md"
          text = read(path)
          text = replace_once(
              text,
              "1. **EVO-118-B API Key / MCP Authorization**\n   - API Key 管理限制为 Owner/Admin；",
              f"1. **EVO-118-B API Key / MCP Authorization — Done**\n   - PR #3 merged `{MERGE_SHA}`；最终 CI `{CI_RUN}` 全绿，SEC-01 已解除；\n   - API Key 管理限制为 Owner/Admin；",
              "plan B status",
          )
          text = replace_once(
              text,
              "EVO-118-A Review/merge\n→ EVO-118-B",
              "EVO-118-A Done\n→ EVO-118-B Done",
              "plan sequence",
          )
          write(path, text)

          # Production Readiness Baseline and gate evidence.
          path = "docs/reference/PRODUCTION-READINESS-BASELINE.md"
          text = read(path)
          text = replace_once(
              text,
              "| API Key / RBAC | Partial | 基础租户隔离 | API Key 管理角色、权限字符串、MCP execute scope 存在缺口 |",
              "| API Key / RBAC | Hardened baseline | Owner/Admin Key management、Typed Capability、MCP execute 与跨租户隐藏语义可依赖 | SEC-01 已解除；legacy Key 仍需按授权合约轮换 |",
              "baseline capability matrix",
          )
          text = replace_once(
              text,
              "| SEC-01 | 普通成员可能管理/授予高权限 API Key；MCP 调用未严格检查 `execute` | [EVO-118-B](../backlog/active/EVO-118-B-api-key-mcp-authorization-hardening.md) | 角色矩阵、Typed Capability、负向权限测试和已有 Key 审计通过 |",
              f"| SEC-01 | **已解除（2026-07-31）**：API Key 管理、Typed Capability、MCP execute、跨租户审计/隐藏语义已闭合 | [EVO-118-B](../backlog/active/EVO-118-B-api-key-mcp-authorization-hardening.md) | PR #3 merged `{MERGE_SHA}`；CI `{CI_RUN}` 全绿；负向授权与撤销/过期/跨租户测试通过 |",
              "baseline SEC-01 row",
          )
          text = replace_once(
              text,
              "- 每关闭一个发布 Gate，应更新本文件、EVO-118 父项、Backlog、Board 和相关 Iteration。",
              f"- SEC-01 已于 2026-07-31 由 EVO-118-B 解除：PR #3 merged `{MERGE_SHA}`，最终 CI `{CI_RUN}` 全绿。\n- 每关闭一个发布 Gate，应更新本文件、EVO-118 父项、Backlog、Board 和相关 Iteration。",
              "baseline evidence",
          )
          write(path, text)

          # Validate targeted stale state has been removed from owner/derived docs.
          checks = {
              "docs/backlog/active/EVO-118-B-api-key-mcp-authorization-hardening.md": ["- **状态**：Review", "workspace tests 最终只读复验中"],
              "docs/iterations/ITERATION-051.md": ["> 文档状态：Review", "- 闭环状态：`Partial`"],
              "docs/BOARD.md": ["Draft PR #3", "SEC-01 尚未解除"],
              "docs/backlog/PRODUCT-BACKLOG.md": ["Iteration 051 / Draft PR #3", "A Done，B Review"],
              "docs/backlog/active/EVO-118-production-readiness-and-security-hardening.md": ["hard-required Rust/前端门禁未运行"],
          }
          for checked_path, stale_values in checks.items():
              content = read(checked_path)
              for stale in stale_values:
                  if stale in content:
                      raise AssertionError(f"stale closeout state remains in {checked_path}: {stale}")
          PY

          git diff --check
          git status --short

          if git diff --quiet; then
            echo "Closeout already applied"
            exit 0
          fi

          git config user.name "evolith-ci"
          git config user.email "actions@users.noreply.github.com"
          git add docs/backlog/active/EVO-118-B-api-key-mcp-authorization-hardening.md \
                  docs/iterations/ITERATION-051.md \
                  docs/iterations/README.md \
                  docs/backlog/active/EVO-118-production-readiness-and-security-hardening.md \
                  docs/BOARD.md \
                  docs/backlog/PRODUCT-BACKLOG.md \
                  docs/roadmap/PRODUCTION-READINESS-PLAN-2026-07.md \
                  docs/reference/PRODUCTION-READINESS-BASELINE.md
          git commit -m "docs: close EVO-118-B and iteration 051"
          git push origin "HEAD:${{ github.head_ref }}"
