name: evo-127-a-security-diagnostic

on:
  push:
    branches:
      - agent/evo-127-a-graphql-foundation

permissions:
  contents: read

concurrency:
  group: evo-127-a-security-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-test:
    name: GraphQL security (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: cookie-missing-csrf
            test: graphql_cookie_session_without_csrf_fails_closed
          - case: cookie-double-submit
            test: graphql_cookie_session_with_double_submit_csrf_passes_transport_gate
          - case: bearer-only
            test: graphql_bearer_only_request_is_not_blocked_by_browser_csrf

    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: evolith-rust

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Build frontend for rust-embed
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install backend build dependency
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Run targeted GraphQL security test
        working-directory: backend
        env:
          DATABASE__DATABASE_TYPE: sqlite
          DATABASE__URL: "sqlite::memory:"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --locked -p api --test graphql_security_tests "${{ matrix.test }}" -- --exact --nocapture
