version: '3.8'

# =============================================================================
# Evolith Production Stack
# Usage: docker compose -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: evolith-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evolith}
      POSTGRES_USER: ${POSTGRES_USER:-evolith}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evolith}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: evolith-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io/evolith}/evolith-backend:${TAG:-latest}
    container_name: evolith-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      SERVER__HOST: 0.0.0.0
      SERVER__PORT: 8080
      DATABASE__DATABASE_TYPE: postgres
      DATABASE__URL: postgres://${POSTGRES_USER:-evolith}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-evolith}
      REDIS__URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      JWT__SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT__EXPIRATION: ${JWT_EXPIRATION:-86400}
      LOG__LEVEL: ${LOG_LEVEL:-info}
      CORS__ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://evolith.io,https://app.evolith.io}
      SMTP__HOST: ${SMTP_HOST:-}
      SMTP__PORT: ${SMTP_PORT:-587}
      SMTP__USERNAME: ${SMTP_USERNAME:-}
      SMTP__PASSWORD: ${SMTP_PASSWORD:-}
      SMTP__FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@evolith.io}
      SANDBOX__ENABLED: ${SANDBOX_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ---------------------------------------------------------------------------
  # Frontend (Static SPA served by Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${REGISTRY:-ghcr.io/evolith}/evolith-frontend:${TAG:-latest}
    container_name: evolith-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: evolith-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${SSL_CERT_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
