type GraphQLFoundationInfo {
	service: String!
	transport: String!
	version: String!
}

"""
Public representation of the resolved caller's session claims.

Never includes credentials or tokens. A null `currentSession` means the transport
supplied no authenticated principal, not that a credential was valid but expired.
"""
type GraphQLSessionInfo {
	userId: String!
	tenantId: String!
	role: String!
	tenantRole: String!
}

type GraphQLViewer {
	id: String!
	email: String!
	username: String!
	role: String!
	tenantId: String!
	tenantRole: String!
	emailVerified: Boolean!
}

type MutationRoot {
	"""
	Foundation-only mutation used to keep a stable root while domain mutations migrate later.
	"""
	graphqlFoundationNoop: Boolean!
}

type QueryRoot {
	"""
	Minimal application-API smoke field. Product domains migrate in later EVO-127 slices.
	"""
	graphqlFoundation: GraphQLFoundationInfo!
	"""
	Correlation identifier for the current HTTP request.
	"""
	requestId: String!
	"""
	Authenticated caller claims, or null when no credentials were supplied.
	"""
	currentSession: GraphQLSessionInfo
	"""
	Persisted user profile for an authenticated caller, never exposed anonymously.
	"""
	viewer: GraphQLViewer!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
schema {
	query: QueryRoot
	mutation: MutationRoot
}
